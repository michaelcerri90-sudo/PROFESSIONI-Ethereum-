<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ricettari di Ethereum</title>
<meta name="description" content="Ricettari delle professioni su WoW: Forever: scegli un personaggio e chiedi un craft su Discord.">
<meta property="og:title" content="Ricettari di Ethereum">
<meta property="og:description" content="Ricettari delle professioni su WoW: Forever: scegli un personaggio e chiedi un craft su Discord.">
<meta name="theme-color" content="#ffd000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#151b24;--line:#2a3442;--ink:#e9e3d2;--muted:#9aa3ae;--gold:#ffd000;
  --font-display:"Alegreya SC","Palatino Linotype",Georgia,serif;--font-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box} html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--font-display);font-size:clamp(30px,5vw,46px);margin:0;line-height:1.05;text-wrap:balance}
h1 small{display:block;font-family:var(--font-body);font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--gold)} .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prof{color:var(--gold);font-weight:500} .card b{font-family:var(--font-display);font-size:24px}
.sub,.num{color:var(--muted);font-size:14px} .num{font-variant-numeric:tabular-nums}
</style>
<div class="wrap">
  <h1><small>WoW: Forever</small>Ricettari di Ethereum</h1>
  <div class="grid">
<a class="card" href="cornelius-alchemy/"><span class="prof">[Alchemy]</span><b>Cornelius</b><span class="sub">Tauren druido</span><span class="num">300/300 · 60/196 ricette</span></a>
  </div>
</div>
<script>
// i vecchi link del tipo .../#r-nome-ricetta portano al primo ricettario
if (location.hash.indexOf("#r-") === 0) location.replace("cornelius-alchemy/" + location.hash);
</script>
</html>
